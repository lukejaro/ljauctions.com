[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[[headers]]
for = "/*"
[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Astro fingerprints built assets under /_astro/.
[[headers]]
for = "/_astro/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# Static vCard. Phones use the content type to open Add Contact.
[[headers]]
for = "/luke-jaroszewski.vcf"
[headers.values]
  Content-Type = "text/vcard; charset=utf-8"
  Content-Disposition = "attachment; filename=\"luke-jaroszewski.vcf\""
